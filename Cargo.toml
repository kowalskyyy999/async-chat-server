[workspace]
resolver = "3"
members = [
    "server",
    "client"
]
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
bincode = { version = "2", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
